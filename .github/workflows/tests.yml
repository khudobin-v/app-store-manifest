name: Tests

on:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["scripts/**", "tests/**"]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run update_manifest tests
        run: python3 -m unittest discover -s tests -v

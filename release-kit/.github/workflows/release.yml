name: Release

# Один тег = один релиз. Всё, что ниже, запускается только `./release.sh <версия>`.
on:
  push:
    tags: ["v*"]

# Публикация в манифест — критическая секция: два релиза подряд не должны
# толкать apps.json одновременно.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write # нужно для gh release create в этом же репозитории

env:
  # Путь к иконке приложения внутри этого репозитория (необязательно).
  ICON_PATH: store/icon.png

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # нужны объекты тегов, чтобы прочитать changelog

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read tag metadata
        id: tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Аннотированный тег мог приехать «облегчённым» — дотягиваем объект.
          git fetch --force --tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          # Сообщение аннотированного тега = changelog (его пишет release.sh).
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" \
            > "$RUNNER_TEMP/changelog.txt"
          python3 - "$RUNNER_TEMP/changelog.txt" "${TAG#v}" <<'PY'
          import pathlib, sys
          path, version = pathlib.Path(sys.argv[1]), sys.argv[2]
          text = path.read_text(encoding="utf-8").strip() or f"Release {version}"
          path.write_text(text + "\n", encoding="utf-8")
          PY
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "changelog_file=$RUNNER_TEMP/changelog.txt" >> "$GITHUB_OUTPUT"
          echo "Changelog:"
          cat "$RUNNER_TEMP/changelog.txt"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::secret KEYSTORE_BASE64 не задан — APK нечем подписать"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # Никаких echo содержимого: в лог попадает только размер.
          echo "keystore: $(stat -c%s "$RUNNER_TEMP/release.keystore") bytes"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Extract APK metadata
        id: apk
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::подписанный APK не найден в app/build/outputs/apk/release"
            exit 1
          fi

          BUILD_TOOLS_DIR="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          BADGING="$("$AAPT2" dump badging "$APK")"

          # Строка вида:
          #   package: name='com.example.app' versionCode='12' versionName='1.4.0' compileSdkVersionCodename='16'
          # Отсюда важно брать ПЕРВОЕ вхождение каждого ключа с пробелом перед ним:
          # без якоря "name='" совпадёт ещё и с хвостом "…VersionCodename='16'".
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep -m1 '^package:')"
          field() { printf '%s' "$PACKAGE_LINE" | grep -o " $1='[^']*'" | head -1 | cut -d"'" -f2; }

          PACKAGE="$(field name)"
          VERSION_CODE="$(field versionCode)"
          VERSION_NAME="$(field versionName)"
          LABEL="$(printf '%s' "$BADGING" | sed -n "s/^application-label:'\(.*\)'$/\1/p" | head -1)"
          [ -n "$LABEL" ] || LABEL="$(printf '%s' "$BADGING" | sed -n "s/^application: .*label='\([^']*\)'.*/\1/p" | head -1)"
          [ -n "$LABEL" ] || LABEL="${GITHUB_REPOSITORY#*/}"

          for pair in "PACKAGE:$PACKAGE" "VERSION_CODE:$VERSION_CODE" "VERSION_NAME:$VERSION_NAME"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::не удалось извлечь ${pair%%:*} из APK через aapt2 dump badging"
              exit 1
            fi
          done

          # Тег и versionName в APK обязаны совпадать: иначе в магазине окажется
          # версия, отличная от той, что просили зарелизить.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::versionName в APK ($VERSION_NAME) не совпадает с тегом ($TAG_VERSION) — поправьте versionName в app/build.gradle.kts"
            exit 1
          fi

          # Подпись обязана быть настоящей (release-ключ), не debug.
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/signer.txt"
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/signer.txt"; then
            echo "::error::APK подписан debug-ключом — проверьте secrets KEYSTORE_*"
            exit 1
          fi

          RENAMED="$RUNNER_TEMP/${PACKAGE}-${VERSION_NAME}.apk"
          cp "$APK" "$RENAMED"
          SHA256="$(sha256sum "$RENAMED" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$RENAMED")"

          {
            echo "path=$RENAMED"
            echo "file=${PACKAGE}-${VERSION_NAME}.apk"
            echo "package=$PACKAGE"
            echo "version_code=$VERSION_CODE"
            echo "version_name=$VERSION_NAME"
            echo "label=$LABEL"
            echo "sha256=$SHA256"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"

          echo "$PACKAGE $VERSION_NAME ($VERSION_CODE), $SIZE bytes, sha256 $SHA256"

      # KVM нужен эмулятору: без него он поднимается минутами и часто падает.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Скриншоты — приятная мелочь, а не условие релиза: эмулятор в CI
      # капризен, и его падение не должно останавливать публикацию.
      - name: Capture screenshots
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./tools/screenshots.sh "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.package }}" "${{ runner.temp }}/screenshots"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"

          # APK обязателен, снимки экрана — если эмулятор их снял.
          ASSETS=("${{ steps.apk.outputs.path }}")
          for shot in "$RUNNER_TEMP"/screenshots/screenshot-*.png; do
            [ -f "$shot" ] && ASSETS+=("$shot")
          done
          echo "ассетов: ${#ASSETS[@]}"

          # Release мог остаться от упавшего прогона (например, не хватило прав
          # на манифест): тогда перезаливаем ассет, а не падаем на «уже существует».
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG уже существует — обновляю ассеты и описание"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" \
              --title "${{ steps.apk.outputs.label }} ${{ steps.apk.outputs.version_name }}" \
              --notes-file "${{ steps.tag.outputs.changelog_file }}"
          else
            gh release create "$TAG" \
              "${ASSETS[@]}" \
              --title "${{ steps.apk.outputs.label }} ${{ steps.apk.outputs.version_name }}" \
              --notes-file "${{ steps.tag.outputs.changelog_file }}"
          fi

      - name: Publish to store
        env:
          STORE_API: ${{ secrets.STORE_API }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${STORE_API:-}" ] || [ -z "${PUBLISH_TOKEN:-}" ]; then
            echo "::error::не заданы secrets STORE_API и PUBLISH_TOKEN"
            exit 1
          fi

          # export: значения читаются из python ниже через os.environ.
          export ICON_URL=""
          if [ -f "$ICON_PATH" ]; then
            export ICON_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${{ steps.tag.outputs.tag }}/${ICON_PATH}"
          fi

          # Снимки экрана уже лежат ассетами релиза — витрине нужны их ссылки.
          SCREENSHOT_URLS=""
          for shot in "$RUNNER_TEMP"/screenshots/screenshot-*.png; do
            [ -f "$shot" ] || continue
            SCREENSHOT_URLS="$SCREENSHOT_URLS https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.tag.outputs.tag }}/$(basename "$shot")"
          done
          export SCREENSHOT_URLS

          # JSON собираем питоном: changelog многострочный, кавычки экранировать вручную нельзя.
          python3 - "${{ steps.tag.outputs.changelog_file }}" > "$RUNNER_TEMP/publish.json" <<PY
          import json, os, sys
          payload = {
              "id": "${{ steps.apk.outputs.package }}",
              "name": "${{ steps.apk.outputs.label }}",
              "versionCode": int("${{ steps.apk.outputs.version_code }}"),
              "versionName": "${{ steps.apk.outputs.version_name }}",
              "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.tag.outputs.tag }}/${{ steps.apk.outputs.file }}",
              "sha256": "${{ steps.apk.outputs.sha256 }}",
              "apkSizeBytes": int("${{ steps.apk.outputs.size }}"),
              "changelog": open(sys.argv[1], encoding="utf-8").read().strip(),
          }
          icon = os.environ.get("ICON_URL")
          if icon:
              payload["iconUrl"] = icon
          shots = os.environ.get("SCREENSHOT_URLS", "").split()
          if shots:
              payload["screenshots"] = shots
          print(json.dumps(payload, ensure_ascii=False))
          PY

          # Витрина отклоняет повтор versionCode кодом 409 — это ошибка сборки.
          STATUS="$(curl -sS -o "$RUNNER_TEMP/publish-response.json" -w '%{http_code}' \
            -X POST "${STORE_API%/}/api/apps" \
            -H "Authorization: Bearer $PUBLISH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/publish.json")"

          cat "$RUNNER_TEMP/publish-response.json"
          echo
          if [ "$STATUS" = "409" ]; then
            echo "::error::витрина отклонила версию: поднимите versionCode в app/build.gradle.kts"
            exit 1
          fi
          if [ "$STATUS" != "200" ]; then
            echo "::error::витрина ответила HTTP $STATUS"
            exit 1
          fi
          echo "Опубликовано в ${STORE_API%/}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ steps.apk.outputs.label }} ${{ steps.apk.outputs.version_name }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| package | \`${{ steps.apk.outputs.package }}\` |"
            echo "| versionCode | ${{ steps.apk.outputs.version_code }} |"
            echo "| размер | ${{ steps.apk.outputs.size }} bytes |"
            echo "| sha256 | \`${{ steps.apk.outputs.sha256 }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

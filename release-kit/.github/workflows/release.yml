name: Release

# Один тег = один релиз. Всё, что ниже, запускается только `./release.sh <версия>`.
on:
  push:
    tags: ["v*"]

# Публикация в манифест — критическая секция: два релиза подряд не должны
# толкать apps.json одновременно.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write # нужно для gh release create в этом же репозитории

env:
  # ЗАМЕНИТЕ на свой репозиторий манифеста (владелец/имя).
  MANIFEST_REPO: YOUR_GITHUB_USERNAME/app-store-manifest
  # Путь к иконке приложения внутри этого репозитория (необязательно).
  ICON_PATH: store/icon.png

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # нужны объекты тегов, чтобы прочитать changelog

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read tag metadata
        id: tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Аннотированный тег мог приехать «облегчённым» — дотягиваем объект.
          git fetch --force --tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          # Сообщение аннотированного тега = changelog (его пишет release.sh).
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" \
            > "$RUNNER_TEMP/changelog.txt"
          python3 - "$RUNNER_TEMP/changelog.txt" "${TAG#v}" <<'PY'
          import pathlib, sys
          path, version = pathlib.Path(sys.argv[1]), sys.argv[2]
          text = path.read_text(encoding="utf-8").strip() or f"Release {version}"
          path.write_text(text + "\n", encoding="utf-8")
          PY
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "changelog_file=$RUNNER_TEMP/changelog.txt" >> "$GITHUB_OUTPUT"
          echo "Changelog:"
          cat "$RUNNER_TEMP/changelog.txt"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::secret KEYSTORE_BASE64 не задан — APK нечем подписать"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # Никаких echo содержимого: в лог попадает только размер.
          echo "keystore: $(stat -c%s "$RUNNER_TEMP/release.keystore") bytes"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Extract APK metadata
        id: apk
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::подписанный APK не найден в app/build/outputs/apk/release"
            exit 1
          fi

          BUILD_TOOLS_DIR="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          BADGING="$("$AAPT2" dump badging "$APK")"

          # Строка вида:
          #   package: name='com.example.app' versionCode='12' versionName='1.4.0' compileSdkVersionCodename='16'
          # Отсюда важно брать ПЕРВОЕ вхождение каждого ключа с пробелом перед ним:
          # без якоря "name='" совпадёт ещё и с хвостом "…VersionCodename='16'".
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep -m1 '^package:')"
          field() { printf '%s' "$PACKAGE_LINE" | grep -o " $1='[^']*'" | head -1 | cut -d"'" -f2; }

          PACKAGE="$(field name)"
          VERSION_CODE="$(field versionCode)"
          VERSION_NAME="$(field versionName)"
          LABEL="$(printf '%s' "$BADGING" | sed -n "s/^application-label:'\(.*\)'$/\1/p" | head -1)"
          [ -n "$LABEL" ] || LABEL="$(printf '%s' "$BADGING" | sed -n "s/^application: .*label='\([^']*\)'.*/\1/p" | head -1)"
          [ -n "$LABEL" ] || LABEL="${GITHUB_REPOSITORY#*/}"

          for pair in "PACKAGE:$PACKAGE" "VERSION_CODE:$VERSION_CODE" "VERSION_NAME:$VERSION_NAME"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::не удалось извлечь ${pair%%:*} из APK через aapt2 dump badging"
              exit 1
            fi
          done

          # Тег и versionName в APK обязаны совпадать: иначе в магазине окажется
          # версия, отличная от той, что просили зарелизить.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::versionName в APK ($VERSION_NAME) не совпадает с тегом ($TAG_VERSION) — поправьте versionName в app/build.gradle.kts"
            exit 1
          fi

          # Подпись обязана быть настоящей (release-ключ), не debug.
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/signer.txt"
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/signer.txt"; then
            echo "::error::APK подписан debug-ключом — проверьте secrets KEYSTORE_*"
            exit 1
          fi

          RENAMED="$RUNNER_TEMP/${PACKAGE}-${VERSION_NAME}.apk"
          cp "$APK" "$RENAMED"
          SHA256="$(sha256sum "$RENAMED" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$RENAMED")"

          {
            echo "path=$RENAMED"
            echo "file=${PACKAGE}-${VERSION_NAME}.apk"
            echo "package=$PACKAGE"
            echo "version_code=$VERSION_CODE"
            echo "version_name=$VERSION_NAME"
            echo "label=$LABEL"
            echo "sha256=$SHA256"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"

          echo "$PACKAGE $VERSION_NAME ($VERSION_CODE), $SIZE bytes, sha256 $SHA256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"

          # Release мог остаться от упавшего прогона (например, не хватило прав
          # на манифест): тогда перезаливаем ассет, а не падаем на «уже существует».
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG уже существует — обновляю ассет и описание"
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
            gh release edit "$TAG" \
              --title "${{ steps.apk.outputs.label }} ${{ steps.apk.outputs.version_name }}" \
              --notes-file "${{ steps.tag.outputs.changelog_file }}"
          else
            gh release create "$TAG" \
              "${{ steps.apk.outputs.path }}" \
              --title "${{ steps.apk.outputs.label }} ${{ steps.apk.outputs.version_name }}" \
              --notes-file "${{ steps.tag.outputs.changelog_file }}"
          fi

      - name: Checkout manifest repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.MANIFEST_REPO }}
          token: ${{ secrets.MANIFEST_PAT }}
          path: manifest-repo

      - name: Update apps.json
        id: manifest
        run: |
          set -euo pipefail

          ICON_ARG=()
          if [ -f "$ICON_PATH" ]; then
            ICON_ARG=(--icon-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${{ steps.tag.outputs.tag }}/${ICON_PATH}")
          fi

          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.tag.outputs.tag }}/${{ steps.apk.outputs.file }}"

          set +e
          python3 manifest-repo/scripts/update_manifest.py \
            --manifest manifest-repo/apps.json \
            --id "${{ steps.apk.outputs.package }}" \
            --name "${{ steps.apk.outputs.label }}" \
            --version-code "${{ steps.apk.outputs.version_code }}" \
            --version-name "${{ steps.apk.outputs.version_name }}" \
            --apk-url "$APK_URL" \
            --sha256 "${{ steps.apk.outputs.sha256 }}" \
            --apk-size "${{ steps.apk.outputs.size }}" \
            --changelog-file "${{ steps.tag.outputs.changelog_file }}" \
            "${ICON_ARG[@]}"
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 2 ]; then
            echo "::error::versionCode ${{ steps.apk.outputs.version_code }} уже опубликован или меньше текущего — поднимите versionCode в app/build.gradle.kts"
            exit 1
          fi
          exit "$STATUS"

      - name: Commit and push manifest
        working-directory: manifest-repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          if git diff --cached --quiet; then
            echo "::error::apps.json не изменился — публиковать нечего"
            exit 1
          fi
          git commit -m "${{ steps.apk.outputs.package }} ${{ steps.apk.outputs.version_name }} (${{ steps.apk.outputs.version_code }})"

          # Другой релиз мог обновить манифест, пока мы собирались.
          for attempt in 1 2 3; do
            if git push; then
              echo "манифест обновлён (попытка $attempt)"
              exit 0
            fi
            echo "push отклонён, подтягиваю изменения и повторяю…"
            git pull --rebase --no-edit || true
            sleep $((attempt * 3))
          done
          echo "::error::не удалось запушить apps.json в ${MANIFEST_REPO}"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ steps.apk.outputs.label }} ${{ steps.apk.outputs.version_name }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| package | \`${{ steps.apk.outputs.package }}\` |"
            echo "| versionCode | ${{ steps.apk.outputs.version_code }} |"
            echo "| размер | ${{ steps.apk.outputs.size }} bytes |"
            echo "| sha256 | \`${{ steps.apk.outputs.sha256 }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
